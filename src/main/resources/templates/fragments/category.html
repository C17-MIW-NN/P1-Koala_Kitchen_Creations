<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<!--@thymesVar id="category" type="nl.miwnn.ch17.tactischetanuki.koala_kitchen_creations.model.Category"-->
<div th:fragment="categoryCard(category, categoryImage, categoryFavoriteCount)" th:object="${category}" class="col">
    <div class="card h-100 link-card">
        <a class="stretched-link" th:href="@{/category/{categoryName}/recipes(categoryName=*{name})}" ></a>
        <div class="card-header">
            <h5 class="card-title" th:text="*{name}">Category title</h5>
        </div>
        <div class="d-flex" style="height:10rem;">
            <img th:src="${categoryImage}"
                 class="recipe-img flex-fill"
            alt="Category image">
        </div>
        <div class="card-footer">
            <p class="card-text" >
                <span th:text="*{recipes.size()}" /> recipe<span th:if="*{recipes.size() != 1}">s</span>
                <b th:if="${categoryFavoriteCount != 0}" style="color: darkgoldenrod; float: right;">
                    <span th:text="${categoryFavoriteCount}"></span> favorite<span th:if="${categoryFavoriteCount != 1}">s</span>
                </b>
            </p>
        </div>
    </div>
</div>

<!--/*@thymesVar id="categories" type="java.util.List<nl.miwnn.ch17.tactischetanuki.koala_kitchen_creations.model.Category>"*/-->
<div th:fragment="categoryList(categories, categoryImages, categoryFavoriteCounts)" class="container-fluid w-100">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        <th:block th:each="category : ${categories}">
            <div th:replace="~{this :: categoryCard(${category}, ${categoryImages[category.getCategoryId()]},
             ${categoryFavoriteCounts.getOrDefault(category.getCategoryId(),0)})}"></div>
        </th:block>
    </div>
</div>

<div th:fragment="categoryForm(formCategory)">
    <!--@thymesVar id="formCategory" type="nl.miwnn.ch17.tactischetanuki.koala_kitchen_creations.model.Category" -->
    <form class="row g-3" th:action="@{/category/save}" method="post" th:object="${formCategory}">
        <input type="hidden" th:field="*{categoryId}" />
        <div class="col-md-12">
            <div class="mb-3 form-floating">
                <input type="text" id="name" class="form-control" th:field="*{name}">
                <label for="name">Name</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mb-3">Add category</button>
    </form>
</div>

<!-- Modal -->
<div th:fragment="categoryModal(formCategory)" class="modal fade" id="newForm" tabindex="-1" aria-labelledby="newCategoryForm" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <h1 class="modal-title text-center" id="newCategory">Add a category</h1>
            <div class="modal-body">
                <div class="container-fluid">
                    <div th:replace="~{:: categoryForm(${formCategory})}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
