<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<!--/*@thymesVar id="recipe" type="nl.miwnn.ch17.tactischetanuki.koala_kitchen_creations.model.Recipe"*/-->
<div th:fragment="recipeCard(recipe)" th:object="${recipe}" class="col">
    <div class="card h-100 link-card">
        <a class="stretched-link" th:href="@{/recipe/detail/{recipeId}(recipeId=*{recipeId})}" ></a>
        <div class="card-header flex-grow-1" style="min-height: 5rem;">
            <h5 class="card-title d-flex align-items-center">
                <span th:text="*{name}">Recipe name</span>
            </h5>
            <h6 class="card-subtitle mb-2">
                <a th:each="category : *{categories}"
                   class="nav-link active badge badge-pill category-tag rounded-pill  position-relative z-2 me-2"
                   th:href="@{/category/{categoryName}/recipes(categoryName=${category.name})}"
                   th:text="${category.name}" />
            </h6>
        </div>
        <div class="d-flex" style="height: 10rem;">
            <div style="position : absolute;" class="fs-3" th:if="${favoriteIds != null and favoriteIds.contains(recipe.recipeId)}">⭐</div>
            <img th:src="*{imageURL}" class="card-img-bottom recipe-img flex-fill" alt="Recipe image">
        </div>
    </div>
</div>

<!--/*@thymesVar id="recipes" type="java.util.List<nl.miwnn.ch17.tactischetanuki.koala_kitchen_creations.model.Recipe>"*/-->
<div th:fragment="recipeList(recipes)" class="container-fluid w-100">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        <th:block th:each="recipe : ${recipes}"><div th:replace="~{this :: recipeCard(${recipe})}"></div></th:block>
    </div>
</div>
</body>
</html>
