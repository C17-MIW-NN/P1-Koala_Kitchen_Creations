<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/general :: baseheader(~{:: title})}">
    <title th:text="${recipe.name}"></title>
</head>

<body>
<div class="page-wrapper">
    <nav th:replace="~{fragments/general :: navbar(${navItems}, '')}"></nav>
    <div>
        <div class="w-100">
            <img th:src="${recipe.imageURL}" class="img-fluid w-100 banner-img">
        </div>

        <main class="container-fluid py-4">
            <div class="row">
                <div class="col-md-1 col-lg-2">
                </div>
                <div class="col-12 col-md-10 col-lg-8">
                    <h1 class="text-center">
                        <span th:text="${recipe.name}" />
                    </h1>
                    <h4 th:if="${recipe.categories.size() > 0}">
                        Categories:
                        <a th:each="category : *{recipe.categories}"
                           class="nav-link active badge category-tag rounded-pill text-decoration-none me-2"
                           th:href="@{/category/{categoryName}/recipes(categoryName=${category})}"
                           th:text="${category}"/>
                    </h4>
                    <p class="lead mt-3" th:text="${recipe.description}"></p>
                    <div class="container overflow-hidden">
                        <div class="row g-2">
                            <div class="col-12 col-md-4 col-lg-4">
                                <div class="p-3">Ingredients</div>
                                <ul>
                                    <li th:each="recipeIngredient : ${recipe.recipeIngredients}">
                                        <span th:text="${recipeIngredient.name}"></span>
                                        <i th:text="${recipeIngredient.quantity}"></i>
                                        <i th:text="${recipeIngredient.unit}"></i>
                                </li>
                                </ul>
                            </div>
                            <div class="col-12 col-md-8 col-lg-8">
                                <div class="p-3">Method</div>
                                <ol>
                                    <li th:each="recipeStep : *{steps}" th:text="${recipeStep.stepDescription}">
                                    </li>
                                </ol>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-1 col-lg-2 justify-content-center p-0">
                    <aside class="sticky-top d-grid dynamic-sticky-top justify-content-center">
                        <div class="d-flex flex-column flex-shrink-1 gap-2 pt-4">
                            <a class="btn btn-primary btn-wrap" th:href="@{/recipe/edit/{recipeId}(recipeId=*{recipeId})}">
                                Edit recipe
                            </a>
                            <a class="btn btn-wrap btn-danger"
                               th:href="@{/recipe/delete/{recipeId}(recipeId=*{recipeId})}">
                                Delete recipe
                            </a>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>


    <footer th:replace="~{fragments/general :: footer}"></footer>
    <div th:replace="~{fragments/general :: bottomScripts}"></div>
</div>
</body>
</html>
