<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/general :: baseheader(~{:: title})}">
    <title th:if="${formRecipe.recipeId == null}">Create recipe</title>
    <title th:unless="${formRecipe.recipeId == null}">Edit recipe</title></head>

<body>
<script src="/js/dynamicList.js"></script>
<script>
    function updateDefaultUnit(input) {
        const selectedOption = document.getElementById("knownIngredients").querySelector(`[value="${input.value}"]`);
        const unitInput = input.closest("[data-list-row]").querySelector("[data-ingredient-unit]");
        if (selectedOption !== null) {
            unitInput.value = selectedOption.getAttribute("data-default-unit");
        }
    }
</script>
<div class="page-wrapper">
    <nav th:replace="~{fragments/general :: navbar(${navItems}, '')}"></nav>

    <main class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-1 col-lg-2">
            </div>
            <div class="col-12 col-md-10 col-lg-8">
                <form method="post" id="recipeForm" th:action="@{/recipe/save}" th:object="${formRecipe}"
                      autocomplete="off" data-1p-ignore data-lpignore="true" data-protonpass-ignore="true"
                      enctype="multipart/form-data">
                    <datalist id="knownIngredients">
                        <option th:each="ingredient : ${knownIngredients}" th:value="${ingredient.name}"
                        th:data-default-unit="${ingredient.defaultUnit}"></option>
                    </datalist>
                    <input type="hidden" th:field="*{recipeId}" />
                    <input type="hidden" name="ingredientCount" th:value="*{recipeIngredients.size()}" />
                    <div class="mb-3">
                        <label for="recipeName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="recipeName" th:field="*{name}">
                    </div>
                    <div class="mb-3">
                        <label for="imageFile" class="col-form-label">Image recipe</label>
                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('imageURL')} ? 'is-invalid' : ''"
                               type="file" id="imageFile" name="recipeImage" accept="image/*">
                        <input type="hidden" name="imageURL" th:value="*{imageURL}"/>
                        <span id="imageFileHelp" class="form-text" th:if="${#fields.hasErrors('imageURL')}"
                              th:errors="*{imageURL}">
                        </span>
                    </div>
                    <div class="mb-3">
                        <label for="selectedCategories" class="form-label">Categories</label>
                        <select id="selectedCategories" name="categories" class="form-select category-select"
                                data-searchable="true"
                                data-creatable="true"
                                data-creatable-text="New category: &lt;b&gt;{value}&lt;/b&gt;..."
                                multiple data-use-bootstrap-select>
                            <option th:each="optionCategory : ${availableCategories}"
                                    th:text="${optionCategory.name}"
                                    th:value="${optionCategory.name}"
                                    th:selected="${formRecipe.categories.contains(optionCategory.name)}"/>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recipeDescription" class="form-label">Description</label>
                        <textarea type="text" class="form-control" id="recipeDescription" th:field="*{description}"
                                  rows="6">
                        </textarea>
                    </div>
                    <div>
                        <label class="form-label">Ingredients</label>
                    </div>
                    <div data-list-container id="ingredient-list">
                        <div data-list-row class="input-group mb-1"
                            th:each="ingredient, itemStat : *{recipeIngredients}"
                            th:with="idx=${itemStat.index}">
                            <input list="knownIngredients" class="form-control flex-grow-1"
                                    th:field="*{recipeIngredients[__${idx}__].name}" oninput="updateDefaultUnit(this)"/>
                            <input type="hidden" th:field="*{recipeIngredients[__${idx}__].id}" />
                            <input class="form-control flex-grow-1" th:field="*{recipeIngredients[__${idx}__].quantity}" />
                            <input class="form-control flex-grow-0" style="width: 6em;"
                                   th:field="*{recipeIngredients[__${idx}__].unit}" data-ingredient-unit />
                            <button type="button" class="btn btn-danger" onclick="deleteListRow(this)">
                                <i class="btn-danger bi bi-trash-fill"></i>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary mb-3 btn btn-success"
                            onclick="addListRow('ingredient-list')">
                        Add ingredient
                    </button>

                    <div class="my-3">
                        <label class="form-label">Preperation steps</label>
                    </div>

                    <div data-list-container id="stepsContainer">
                        <div data-list-row class="input-group mb-1" th:each="step, stat : *{recipeSteps}">
                            <textarea class="form-control"
                                th:field="*{recipeSteps[__${stat.index}__]}"
                                      placeholder="Describe step..." ></textarea>
                            <button type="button" class="btn btn-danger" onclick="deleteListRow(this)">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary mb-3 btn btn-success" onclick="addListRow('stepsContainer')">
                        Add step
                    </button>

                    <button th:if="${formRecipe.recipeId == null}">Add recipe
                    </button>
                </form>
            </div>
            <div class="col-md-1 col-lg-2 justify-content-center p-0">
                <aside class="sticky-top d-grid dynamic-sticky-top justify-content-center">
                    <div class="d-flex flex-column flex-shrink-1 gap-2 pt-4">
                        <button type="submit" form="recipeForm" class="btn btn-primary btn-wrap">
                            <span th:unless="${formRecipe.recipeId == null}">Update recipe</span>
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </main>


    <footer th:replace="~{fragments/general :: footer}"></footer>
    <div th:replace="~{fragments/general :: bottomScripts}"></div>
    <script>
        for (let selectElement of document.querySelectorAll("[data-use-bootstrap-select]")) {
            new UseBootstrapSelect(selectElement);
        }
    </script>
</div>
</body>
</html>
